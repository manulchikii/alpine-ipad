name: Build Alpine XFCE ARM64 image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils parted dosfstools e2fsprogs

      - name: Write Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM alpine:3.21
          RUN apk add --no-cache alpine-base openrc linux-virt mkinitfs e2fsprogs \
              eudev udev-init-scripts udev-init-scripts-openrc dbus polkit-elogind elogind \
              grub grub-efi bash sudo shadow nano \
              xorg-server xf86-input-libinput xf86-video-fbdev mesa-dri-gallium mesa-egl \
              lightdm lightdm-gtk-greeter xfce4 xfce4-terminal thunar mousepad \
              font-dejavu adwaita-icon-theme gvfs build-base git python3 firefox
          RUN apk add --no-cache dbus-openrc elogind-openrc lightdm-openrc spice-vdagent spice-vdagent-openrc || true
          RUN for s in devfs dmesg udev udev-trigger udev-settle; do rc-update add $s sysinit || true; done; \
              for s in modules sysctl hostname bootmisc networking swclock syslog root localmount; do rc-update add $s boot || true; done; \
              for s in dbus elogind lightdm spice-vdagentd; do rc-update add $s default || true; done; \
              for s in mount-ro killprocs savecache; do rc-update add $s shutdown || true; done
          RUN echo alpine-ipad > /etc/hostname \
              && mkdir -p /etc/network \
              && printf 'auto lo\niface lo inet loopback\n\nauto eth0\niface eth0 inet dhcp\n' > /etc/network/interfaces \
              && adduser -D -s /bin/bash user \
              && for g in wheel video input audio; do addgroup user $g || true; done \
              && echo 'user:alpine' | chpasswd && echo 'root:alpine' | chpasswd \
              && mkdir -p /etc/sudoers.d && echo '%wheel ALL=(ALL:ALL) ALL' > /etc/sudoers.d/wheel \
              && mkdir -p /etc/lightdm/lightdm.conf.d \
              && printf '[Seat:*]\nautologin-user=user\nautologin-session=xfce\n' > /etc/lightdm/lightdm.conf.d/50-autologin.conf \
              && mkdir -p /etc/mkinitfs \
              && echo 'features="base ext4 virtio scsi ata usb"' > /etc/mkinitfs/mkinitfs.conf
          EOF

      - name: Build rootfs and disk image
        run: |
          set -euxo pipefail
          WORK="$PWD/work"; OUT="$PWD/out"
          mkdir -p "$WORK/mnt" "$OUT"

          docker build -t alpine-xfce-rootfs .
          cid=$(docker create alpine-xfce-rootfs /bin/true)
          docker export "$cid" -o "$WORK/rootfs.tar"
          docker rm "$cid"

          RAW="$WORK/disk.raw"
          truncate -s 10G "$RAW"
          parted -s "$RAW" mklabel gpt \
            mkpart ESP fat32 1MiB 257MiB set 1 esp on \
            mkpart root ext4 257MiB 100%
          LOOP=$(sudo losetup --find --show --partscan "$RAW")

          sudo mkfs.vfat -F32 -n EFI "${LOOP}p1"
          sudo mkfs.ext4 -q -L alpine-root "${LOOP}p2"
          sudo mount "${LOOP}p2" "$WORK/mnt"
          sudo mkdir -p "$WORK/mnt/boot/efi"
          sudo mount "${LOOP}p1" "$WORK/mnt/boot/efi"
          sudo tar -xpf "$WORK/rootfs.tar" -C "$WORK/mnt"

          ROOT_UUID=$(sudo blkid -s UUID -o value "${LOOP}p2")
          EFI_UUID=$(sudo blkid -s UUID -o value "${LOOP}p1")
          printf 'UUID=%s / ext4 defaults,noatime 0 1\nUUID=%s /boot/efi vfat defaults 0 2\n' \
            "$ROOT_UUID" "$EFI_UUID" | sudo tee "$WORK/mnt/etc/fstab"

          cat > "$WORK/grub.cfg" <<GRUBEOF
          set timeout=1
          search --no-floppy --fs-uuid --set=root $ROOT_UUID
          menuentry "Alpine Linux" {
            linux /boot/vmlinuz-virt root=UUID=$ROOT_UUID rootfstype=ext4 modules=ext4 console=tty0 quiet
            initrd /boot/initramfs-virt
          }
          GRUBEOF
          sudo cp "$WORK/grub.cfg" "$WORK/mnt/tmp/grub.cfg"

          sudo mount --bind /dev "$WORK/mnt/dev"
          sudo mount -t proc proc "$WORK/mnt/proc"
          sudo mount -t sysfs sys "$WORK/mnt/sys"

          KVER=$(ls "$WORK/mnt/lib/modules" | head -n1)
          sudo chroot "$WORK/mnt" mkinitfs -o /boot/initramfs-virt "$KVER"
          sudo mkdir -p "$WORK/mnt/boot/efi/EFI/BOOT"
          sudo chroot "$WORK/mnt" grub-mkstandalone -O arm64-efi \
            -o /boot/efi/EFI/BOOT/BOOTAA64.EFI \
            --modules="part_gpt part_msdos fat ext2 search search_fs_uuid normal linux configfile" \
            "boot/grub/grub.cfg=/tmp/grub.cfg"

          sudo umount "$WORK/mnt/sys" "$WORK/mnt/proc" "$WORK/mnt/dev"
          sudo umount "$WORK/mnt/boot/efi" "$WORK/mnt"
          sudo losetup -d "$LOOP"

          qemu-img convert -O qcow2 -c "$RAW" "$OUT/alpine-xfce.qcow2"
          ls -lh "$OUT"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: alpine-xfce-arm64
          path: out/alpine-xfce.qcow2
          compression-level: 0
